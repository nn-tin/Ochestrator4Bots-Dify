services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-orchestrator}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-orchestrator-dev-password}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Keep the URI empty so the app builds and URL-encodes it from the exact
      # same credentials used to initialize MongoDB below.
      MONGODB_URI: ""
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: ${MONGO_ROOT_USERNAME:-orchestrator}
      MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD:-orchestrator-dev-password}
      MONGODB_AUTH_SOURCE: admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-orchestrator}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION:-conversations}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-5000}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  mongodb_data:
